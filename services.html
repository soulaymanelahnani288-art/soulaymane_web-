<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الخدمات المتاحة - Soulaymane Web</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #111827,
                #312e81,
                #581c87
            );

            color: white;
        }

        .container {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }

        /* المربع */
        .services-box {
            width: 90%;
            max-width: 650px;

            background: rgba(0, 0, 0, 0.75);

            border: 3px solid #ffd700;
            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 0 25px rgba(255, 215, 0, 0.6);

            text-align: center;
        }

        .title {
            color: #00e5ff;
            font-size: 35px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00e5ff;
        }

        .service {
            color: #ffffff;
            font-size: 24px;
            margin: 22px 0;

            text-shadow: 0 0 8px #00e5ff;
        }

        .back {
            display: inline-block;

            margin-top: 30px;

            color: #ffd700;
            border: 2px solid #ffd700;

            padding: 12px 25px;

            border-radius: 10px;

            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            transition: 0.3s;
        }

        .back:hover {
            background: #ffd700;
            color: black;
        }

        @media (max-width: 600px) {

            .services-box {
                padding: 25px 15px;
            }

            .title {
                font-size: 28px;
            }

            .service {
                font-size: 19px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="services-box">

            <div class="title">
                الخدمات المتاحة
            </div>

            <div class="service">
                1 ـ سيت ويب للمطاعم.
            </div>

            <div class="service">
                2 ـ سيت ويب للمحلات.
            </div>

            <div class="service">
                3 ـ سيت ويب لموقع تجاري.
            </div>

            <a class="back" href="index.html">
                ← الرجوع للصفحة الرئيسية
            </a>

        </div>

    </div>

</body>
</html>
